name: Build Windows EXE + Upload OSS

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron-builder/Cache
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Build Windows EXE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 关键：--publish never 避免打 tag 后 electron-builder 自动尝试发布
          # 到 GitHub Release 而报 "GitHub Personal Access Token is not set"。
          # 发布由下方单独的 gh release 步骤负责。
          # productName 用 package.json 里的中文「AI共识」。
          npm run build -- --publish never

      - name: Rename EXE to fixed filename
        shell: bash
        run: |
          # 统一为固定文件名 ai-group-chat-Setup.exe（每次覆盖旧包）
          for f in dist/*.exe; do
            base=$(basename "$f")
            if [[ "$base" == __uninstaller* || "$base" == "ai-group-chat-Setup.exe" ]]; then
              continue
            fi
            mv "$f" "dist/ai-group-chat-Setup.exe"
          done
          echo "=== EXE 列表 ==="
          ls -la dist/*.exe

      - name: Upload EXE to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          python -m pip install --quiet oss2
          python - <<'PY'
          import oss2, glob, os, sys
          kid = os.environ.get('OSS_ACCESS_KEY_ID', '')
          sec = os.environ.get('OSS_ACCESS_KEY_SECRET', '')
          if not kid or not sec:
              print('SKIP: OSS secrets not set'); sys.exit(0)
          auth = oss2.Auth(kid, sec)
          bucket = oss2.Bucket(auth, 'https://oss-ap-southeast-1.aliyuncs.com', 'ai-group-chat')
          # 固定文件名覆盖上传（替换旧包，不新增）
          exe = 'dist/ai-group-chat-Setup.exe'
          if os.path.exists(exe):
              bucket.put_object_from_file('chat/ai-group-chat-Setup.exe', exe)
              print('Uploaded: chat/ai-group-chat-Setup.exe', os.path.getsize(exe), 'bytes')
          else:
              print('ERROR: installer not found:', exe)
          PY

      - name: Publish EXE to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create build-latest --title "Latest build" --prerelease --notes "Auto build from ${GITHUB_SHA::7}" || true
          gh release upload build-latest dist/ai-group-chat-Setup.exe --clobber
