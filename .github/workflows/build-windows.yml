name: Build Windows EXE + Upload OSS

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron-builder/Cache
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Build Windows EXE
        shell: bash
        run: |
          # CI 的 Windows runner 是 en-US locale，中文 productName 会触发
          # electron-builder 的 sanitize "Invalid name" 错误（本地中文 locale 无此问题）。
          # 构建时临时用英文 productName；安装包文件名走 nsis.artifactName（英文），
          # 快捷方式名仍为中文（nsis.shortcutName="AI共识"）。
          npm run build -- --config.productName="AI-GongShi"
        # electron-builder --win → 产物在 dist/，文件名由 artifactName 决定（英文）

      - name: Rename EXE to english filename
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # 只重命名 installer（跳过 uninstaller 和已是英文名的文件）
          for f in dist/*.exe; do
            base=$(basename "$f")
            if [[ "$base" == __uninstaller* || "$base" == ai-group-chat-* ]]; then
              continue
            fi
            mv "$f" "dist/ai-group-chat-Setup-${VERSION}.exe"
          done
          echo "=== EXE 列表 ==="
          ls -la dist/*.exe

      - name: Upload EXE to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          python -m pip install --quiet oss2
          python - <<'PY'
          import oss2, glob, os, sys
          kid = os.environ.get('OSS_ACCESS_KEY_ID', '')
          sec = os.environ.get('OSS_ACCESS_KEY_SECRET', '')
          if not kid or not sec:
              print('SKIP: OSS secrets not set'); sys.exit(0)
          auth = oss2.Auth(kid, sec)
          bucket = oss2.Bucket(auth, 'https://oss-ap-southeast-1.aliyuncs.com', 'ai-group-chat')
          # 只上传 installer（ai-group-chat-*.exe），跳过 uninstaller
          for exe in glob.glob('dist/ai-group-chat-*.exe'):
              key = 'chat/' + os.path.basename(exe)
              bucket.put_object_from_file(key, exe)
              print('Uploaded:', key, os.path.getsize(exe), 'bytes')
          PY

      - name: Publish EXE to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create build-latest --title "Latest build" --prerelease --notes "Auto build from ${GITHUB_SHA::7}" || true
          gh release upload build-latest dist/ai-group-chat-*.exe --clobber
