name: Build Mobile Apps

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Expose secrets as job-level env so step `if:` conditions can reference them.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to public Release (stable URL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create build-latest --title "Latest Android build" --prerelease --notes "Auto build from commit ${GITHUB_SHA::7}" || true
          gh release upload build-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber

      # --- Signed RELEASE APK (only when both secrets are set) ---
      - name: Restore release keystore from secrets
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PROPS != '' }}
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_PROPS" > keystore.properties
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ai-chat-release.keystore
          echo "keystore restored: $(ls -l ai-chat-release.keystore | awk '{print $5}') bytes"

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PROPS != '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PROPS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish signed release APK to Release
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PROPS != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload build-latest android/app/build/outputs/apk/release/app-release.apk --clobber || true

      - name: Upload APK to Pgyer (蒲公英)
        env:
          PGY_API_KEY: ${{ secrets.PGY_API_KEY }}
        run: |
          APK=""
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ -n "$APK" ] && [ -n "$PGY_API_KEY" ]; then
            echo "Uploading $APK to Pgyer..."
            curl -s -F "file=@${APK}" -F "_api_key=${PGY_API_KEY}" -F "buildUpdateDescription=v$(node -p "require('./package.json').version") auto build ${GITHUB_SHA::7}" https://www.pgyer.com/apiv2/app/upload
          else
            echo "SKIP: no APK or PGY_API_KEY not set"
          fi

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 --save

      - name: Add iOS platform
        run: npx cap add ios || true

      - name: Sync iOS
        run: npx cap sync ios

      # Build an UNSIGNED archive (no Apple Developer cert required).
      # A real, installable IPA still needs Apple Developer signing (TestFlight / App Store).
      - name: Build unsigned archive
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO archive -archivePath build/App.xcarchive

      - name: Generate ExportOptions.plist (ad-hoc, unsigned)
        working-directory: ios/App
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA (best-effort, requires signing to succeed)
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa -exportOptionsPlist ExportOptions.plist CODE_SIGNING_ALLOWED=NO || true

      - name: Upload IPA (if produced)
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-ios-ipa
          path: ios/App/build/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload unsigned build (xcarchive) as fallback
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-ios-build
          path: ios/App/build/App.xcarchive
          if-no-files-found: ignore
          retention-days: 30
